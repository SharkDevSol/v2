[package]
name = "desktop-staff"
version = "2.0.0"
description = "Skoolific V2 Staff Desktop Application"
authors = ["Skoolific"]
edition = "2021"

[lib]
name = "desktop_staff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
